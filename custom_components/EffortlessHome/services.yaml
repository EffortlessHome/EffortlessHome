createcleanmotionfilesservice:
  description: Service to clean motion files
  fields:
    age:
      name: age
      description: The age of the files to remove. Default 30 days.
      example: 30

add_label_to_entity:
  description: add a label to an entity
  fields:
    entity_id:
      name: Entity
      description: The the entity to update.
      example: "entity.name"
      required: true
      selector:
        entity:

    label:
      name: The label to apply
      description: The new label to assign to the entity.
      example: "favorite"
      required: true
      selector:
        label:

notify_person_service:
  description: Notify a person
  fields:
    target:
      name: target
      description: The entity_id of the EffortlessHome person entity to notify
      example: "sensor.jermie_effortlesshome_ai"
    message:
      name: Message
      description: The message to send
      example: 'Hello, this is a notification'
    title:
      name: Title
      description: The title of the notification
      example: 'Notification'
    data:
      name: data
      description: attached data to the message
      example: 'image: "test.jpg"'

create_alert_service:
  description: Create an alert record
  fields:
    alert_type:
      name: alert_type
      description: The type of alert
      example: Humidity Alert
    alert_description:
      name: alert_description
      description: Details about the alert
      example: 'Details about the alert'
    status:
      name: status
      description: The status of the alert
      example: 'Active'


confirmpendingalarmservice:
  description: Confirm pending EffortlessHome alarm

cancelalarmservice:
  description: Cancel EffortlessHome alarm

getalarmstatusservice:
  description: Get EffortlessHome alarm status

update_entity:
  name: Update entity
  description: Updates a entity in the entity registry with an area
  fields:
    entity_id:
      name: Entity
      description: The the entity to update.
      example: "entity.name"
      required: true
      selector:
        entity:

    area_id:
      name: Area
      description: The new area to assign to the entity.
      example: "living_room"
      required: true
      selector:
        area:


deploylatestconfig:
  name: deploylatestconfig
  description: Deploy latest EffortlessHome config
notify:
  name: Send EffortlessHome Notification
  description: Send a notification through EffortlessHome to a person, device, or notify service
  fields:
    message:
      name: Message
      description: The notification message body
      example: "System alert from EffortlessHome"
      required: true
      selector:
        text:
          multiline: true

    title:
      name: Title
      description: The notification title
      example: "EffortlessHome Alert"
      required: false
      selector:
        text:

    target:
      name: Target
      description: The target person entity (person.*), device ID (device_*), or notify service (notify.*) to send to
      example: "person.john_doe"
      required: false
      selector:
        entity:
          multiple: true
          filter:
            domain: 
              - person
              - notify

    data:
      name: Data
      description: Additional notification data (image, tag, group, etc.)
      example: '{"image": "/local/image.jpg", "tag": "alert_001"}'
      required: false
      selector:
        object: