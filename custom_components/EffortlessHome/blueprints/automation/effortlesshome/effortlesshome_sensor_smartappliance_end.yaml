blueprint:
  name: Smart Appliance Sensor Conversion End Automation
  description: Set the end run action(s) to take to convert a dumb appliance to smart
  domain: automation
  author: EffortlessHome
  input:
    sensor:
      name: Sensor
      description:
        The sensor attached to the appliance. Typically
        a vibration, door or temperature sensor.
      selector:
        entity:
          filter:
            - domain:
                - sensor
                - binary_sensor
          multiple: false
   
    appliance_switch:
      name: Dedicated appliance switch
      description: Use one of the defined Appliance Switches to convert the appliance to smart.
      default: switch.smartappliance1
      selector:
        entity:
          domain:
            - switch
          multiple: false
    person_input:
      name: Person
      description: The person to notify
      selector:
        entity:
          domain: person
    notification_message:
      name: Notification message
      description: "Default: Appliance Stopped"
      default: Appliance Stopped

    data_clickaction_url:
      name: URL to Navigate (Optional)
      description:
        The URL to navigate to when clicking on the notification. (default
        = /lovelace)
      default: /lovelace

    additional_actions:
      name: Additional Actions
      description: Add additional actions to execute (Optional)
      default: []
      selector:
        action: {}

trigger:
  platform: state
  entity_id: !input sensor
  from: "on"
  to: "off"

condition:
  - condition: state
    entity_id: !input appliance_switch
    state: "on"
variables:
  clickActionURL: !input data_clickaction_url

action:
  - service: effortlesshome.notify_person_service
    data:
      target: !input person_input
      title: !input notification_message
      message: !input notification_message
      data:
        clickAction: !input data_clickaction_url
        ttl: 0
        priority: high
        url: !input data_clickaction_url

  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: !input appliance_switch

  - choose: []
    default: !input additional_actions
