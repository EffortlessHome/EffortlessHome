blueprint:
  name: Media Playback Lighting Scene
  description: >
    Dim or change lights when media starts playing and restore a scene when paused or stopped.
  domain: automation
  author: EffortlessHome

  input:

    media_player:
      name: Media Player
      description: Media player that triggers the automation
      selector:
        entity:
          domain: media_player

    play_scene:
      name: Scene when media starts playing
      description: Scene to activate when playback begins
      selector:
        entity:
          domain: scene

    stop_scene:
      name: Scene when media stops or pauses
      description: Scene to restore when playback ends
      selector:
        entity:
          domain: scene

    delay_seconds:
      name: Trigger delay
      description: Delay before activating scene (seconds)
      default: 2
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: seconds

mode: restart

trigger:
  - platform: state
    entity_id: !input media_player
    to: "playing"

  - platform: state
    entity_id: !input media_player
    to: "paused"

  - platform: state
    entity_id: !input media_player
    to: "idle"

variables:
  delay_seconds: !input delay_seconds

action:
  - delay:
      seconds: "{{ delay_seconds }}"

  - choose:

      - conditions:
          - condition: state
            entity_id: !input media_player
            state: "playing"
        sequence:
          - service: scene.turn_on
            target:
              entity_id: !input play_scene

      - conditions:
          - condition: template
            value_template: >
              {{ states(!input media_player) in ['paused','idle','off'] }}
        sequence:
          - service: scene.turn_on
            target:
              entity_id: !input stop_scene